name: deploy

# DeployBay's in-cluster Kaniko build fails for this repo, so the image is
# built here and pushed to GHCR; DeployBay pulls the pre-built image.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ghcr.io/doorloop/dl-bonustrackingdb:latest
          labels: org.opencontainers.image.source=https://github.com/doorloop/DL-bonustrackingdb
